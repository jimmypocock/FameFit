<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FameFit - Transform your workouts into XP. Level up your fitness journey on iPhone and Apple Watch.">
    <meta name="keywords" content="fitness, workout, Apple Watch, iPhone, XP, gamification, health">
    <meta property="og:title" content="FameFit - Fitness Reimagined">
    <meta property="og:description" content="Transform every workout into XP. Track progress, unlock achievements, and compete with friends.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://famefit.app">
    <title>FameFit - Fitness Reimagined</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="shimmer-container">
            <div class="shimmer"></div>
        </div>
        <div class="hero-content">
            <h1 class="hero-title">FameFit</h1>
            <p class="hero-description">
                <strong>Fitness reimagined.</strong> Transform every workout into XP. Level up your fitness journey.
            </p>
            <div class="hero-badges">
                <span class="badge">iPhone</span>
                <span class="badge">Apple Watch</span>
            </div>
            <p class="coming-soon">Coming Soon to iOS</p>
        </div>
        <div class="hero-visual">
            <div class="device-container">
                <div class="iphone-mockup">
                    <img src="images/ios.webp" alt="FameFit iOS App" class="device-screen">
                </div>
                <div class="watch-mockup">
                    <img src="images/watch.webp" alt="FameFit Watch App" class="device-screen">
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">FameFit</div>
            <div class="footer-links">
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="mailto:jimmycpocock@gmail.com">Contact</a>
            </div>
            <div class="footer-copyright">
                © 2024 FameFit. Fitness Reimagined.
            </div>
        </div>
    </footer>

    <script src="js/animations.js"></script>
</body>
</html>
